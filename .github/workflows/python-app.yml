name: Python CI

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  test:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Unit_Testing

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run Unit Tests
        run: uv run python -m unittest discover -s tests -p "test_*.py"
